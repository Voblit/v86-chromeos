<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>v86</title>

<style>
    body {
        margin: 0;
        background: #111;
        color: #eee;
        font-family: sans-serif;
    }

    #controls {
        padding: 10px;
        background: #222;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        z-index: 10;
    }

    #powerBtn {
        padding: 10px 20px;
        background: #4CAF50;
        border: none;
        color: white;
        font-size: 16px;
        cursor: pointer;
    }

    #powerBtn:disabled {
        background: #555;
        cursor: not-allowed;
    }

    #screen_container {
        position: absolute;
        top: 50px;
        left: 0;
        width: 100vw;
        height: calc(100vh - 50px);
        background: black;

        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
    }

    canvas {
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
    }
</style>
</head>

<body>

<div id="controls">
    ISO: <input type="file" id="iso_input" accept=".iso,.img">
    HDD: <input type="file" id="hdd_input" accept=".img">
    <button id="powerBtn" disabled>Power On</button>
</div>

<div id="screen_container">
    <div style="white-space: pre; font: 14px monospace; line-height: 14px"></div>
    <canvas></canvas>
</div>

<script src="libv86.js"></script>
<script>
window.onload = function() {

    let isoBuffer = null;
    let hddBuffer = null;
    let emulator = null;

    // Load ISO
    document.getElementById("iso_input").onchange = function(e) {
        const file = e.target.files[0];
        const reader = new FileReader();
        reader.onload = function() {
            isoBuffer = new Uint8Array(reader.result);
            checkReady();
        };
        reader.readAsArrayBuffer(file);
    };

    // Load HDD
    document.getElementById("hdd_input").onchange = function(e) {
        const file = e.target.files[0];
        const reader = new FileReader();
        reader.onload = function() {
            hddBuffer = new Uint8Array(reader.result);
            checkReady();
        };
        reader.readAsArrayBuffer(file);
    };

    function checkReady() {
        if (isoBuffer && hddBuffer) {
            document.getElementById("powerBtn").disabled = false;
        }
    }

    document.getElementById("powerBtn").onclick = function() {

        emulator = new V86({
            wasm_path: "v86.wasm",

            memory_size: 512 * 1024 * 1024,
            vga_memory_size: 8 * 1024 * 1024,

            screen_container: document.getElementById("screen_container"),

            vga: {
                width: 800,
                height: 600
            },

            bios: { url: "seabios.bin" },
            vga_bios: { url: "vgabios.bin" },

            hda: hddBuffer,
            cdrom: isoBuffer,

            autostart: true
        });

        window.addEventListener("resize", () => {
            if (emulator && emulator.screen_adapter) {
                emulator.screen_adapter.set_size(
                    800,
                    600
                );
            }
        });
    };
};
</script>

</body>
</html>
