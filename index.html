<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>v86 on ChromeOS</title>
</head>

<body>
<h3>Load your ISO and HDD:</h3>

ISO: <input type="file" id="iso_input" accept=".iso,.img"><br><br>
HDD: <input type="file" id="hdd_input" accept=".img"><br><br>

<div id="screen_container">
    <div style="white-space: pre; font: 14px monospace; line-height: 14px"></div>
    <canvas></canvas>
</div>

<script src="libv86.js"></script>
<script>
window.onload = function() {

    var emulator = new V86({
        wasm_path: "v86.wasm",

        memory_size: 512 * 1024 * 1024,
        vga_memory_size: 8 * 1024 * 1024,

        screen_container: document.getElementById("screen_container"),

        bios: { url: "seabios.bin" },
        vga_bios: { url: "vgabios.bin" },

        autostart: false
    });

    let isoLoaded = false;
    let hddLoaded = false;

    // Load ISO from USB
    document.getElementById("iso_input").onchange = function(e) {
        var file = e.target.files[0];
        var reader = new FileReader();
        reader.onload = function() {
            emulator.set_cdrom(new Uint8Array(reader.result));
            isoLoaded = true;
            tryStart();
        };
        reader.readAsArrayBuffer(file);
    };

    // Load HDD from USB
    document.getElementById("hdd_input").onchange = function(e) {
        var file = e.target.files[0];
        var reader = new FileReader();
        reader.onload = function() {
            emulator.set_hda(new Uint8Array(reader.result));
            hddLoaded = true;
            tryStart();
        };
        reader.readAsArrayBuffer(file);
    };

    // Start only when both ISO and HDD are loaded
    function tryStart() {
        if (isoLoaded && hddLoaded) {
            emulator.run();
        }
    }
};
</script>

</body>
</html>
