<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>v86 - ChromeOS</title>

<style>
    body {
        margin: 0;
        background: #111;
        color: #eee;
        font-family: sans-serif;
    }

    #controls {
        padding: 10px;
        background: #222;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        z-index: 10;
        display: flex;
        align-items: center;
        gap: 10px;
    }

    #powerBtn {
        padding: 10px 20px;
        background: #4CAF50;
        border: none;
        color: white;
        font-size: 16px;
        cursor: pointer;
    }

    #powerBtn:disabled {
        background: #555;
        cursor: not-allowed;
    }

    #screen_container {
        position: absolute;
        top: 50px;
        left: 0;
        width: 100vw;
        height: calc(100vh - 50px);
        background: black;

        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
    }

    canvas {
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
    }

    select, input {
        background: #333;
        color: #eee;
        border: none;
        padding: 5px 10px;
        font-size: 14px;
        cursor: pointer;
    }
</style>
</head>

<body>

<div id="controls">
    ISO: <input type="file" id="iso_input" accept=".iso,.img">
    HDD: <input type="file" id="hdd_input" accept=".img">
    Relay: <input type="text" id="relay_input" placeholder="wss://YOUR_IP:443" size="22">
    <button id="powerBtn" disabled>Power On</button>
    Scale:
    <select id="scaleSelect">
        <option value="1">1×</option>
        <option value="1.5">1.5×</option>
        <option value="2">2×</option>
        <option value="3">3×</option>
    </select>
</div>

<div id="screen_container">
    <canvas></canvas>
</div>

<script src="libv86.js"></script>
<script>
window.onload = function() {

    let isoBuffer = null;
    let hddBuffer = null;
    let emulator = null;
    let userScale = 1;

    const canvas = document.querySelector("canvas");
    const container = document.getElementById("screen_container");
    const scaleSelect = document.getElementById("scaleSelect");
    const relayInput = document.getElementById("relay_input");

    scaleSelect.onchange = function() {
        userScale = parseFloat(this.value);
        upscale();
    };

    // Load ISO
    document.getElementById("iso_input").onchange = function(e) {
        const file = e.target.files[0];
        const reader = new FileReader();
        reader.onload = function() {
            isoBuffer = new Uint8Array(reader.result);
            checkReady();
        };
        reader.readAsArrayBuffer(file);
    };

    // Load HDD
    document.getElementById("hdd_input").onchange = function(e) {
        const file = e.target.files[0];
        const reader = new FileReader();
        reader.onload = function() {
            hddBuffer = new Uint8Array(reader.result);
            checkReady();
        };
        reader.readAsArrayBuffer(file);
    };

    function checkReady() {
        if (isoBuffer && hddBuffer) {
            document.getElementById("powerBtn").disabled = false;
        }
    }

    function upscale() {
        if (!emulator || !emulator.screen_adapter) return;

        const fbWidth  = emulator.screen_adapter.width;
        const fbHeight = emulator.screen_adapter.height;

        const contWidth  = container.clientWidth;
        const contHeight = container.clientHeight;

        const scale = Math.min(contWidth / fbWidth, contHeight / fbHeight) * userScale;

        canvas.style.width  = (fbWidth  * scale) + "px";
        canvas.style.height = (fbHeight * scale) + "px";
    }

    document.getElementById("powerBtn").onclick = function() {

        const relayURL = relayInput.value.trim();

        emulator = new V86({
            wasm_path: "v86.wasm",

            memory_size: 512 * 1024 * 1024,
            vga_memory_size: 8 * 1024 * 1024,

            screen_container: container,
            screen_resize: true,
            vga_scaling_mode: 1,

            bios: { url: "seabios.bin" },
            vga_bios: { url: "vgabios.bin" },

            hda: hddBuffer,
            cdrom: isoBuffer,

            autostart: true,

            network_relay_url: relayURL,
            network_relay_allow: true,
        });

        emulator.add_listener("screen-set-size", upscale);
        window.addEventListener("resize", upscale);
    };
};
</script>

</body>
</html>
